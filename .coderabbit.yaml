# CodeRabbit org-wide defaults (applies to all transport-stack repos unless a
# repo provides its own .coderabbit.yaml overrides)

language: "en"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  poem: false
  collapse_walkthrough: false
  sequence_diagrams: true
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/fontawesome/**"
    - "!**/static/**"
    - "!**/venv/**"
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/*.lock"

chat:
  auto_reply: true
